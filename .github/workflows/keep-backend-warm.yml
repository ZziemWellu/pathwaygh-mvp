name: Keep backend warm

# Render's free tier spins pathwaygh-backend down after ~15 min of
# inactivity, and the next request then pays a 30-60s cold-start cost -
# this is what caused the registration bug fixed in commit 2917ee0.
# Pinging the lightweight, unauthenticated /health endpoint often enough
# keeps the instance from ever going idle.
#
# This is a stopgap, not a fix: it works only because the free tier's
# idle timer resets on any request, GitHub's own scheduling has a few
# minutes of slack (rarely more), and Render could change this behavior
# at any time. The actual fix is upgrading pathwaygh-backend to a paid
# instance, which removes the spin-down entirely and also removes the
# need for render.yaml's "run migrations in startCommand" workaround.
#
# GitHub disables a workflow's schedule automatically after 60 days with
# no commits to the repo - re-enable it from the Actions tab if that
# ever happens on a quiet repo.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --max-time 60 https://pathwaygh-backend.onrender.com/health
