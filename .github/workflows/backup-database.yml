name: Backup database

# An independent backup, on top of Neon's own restore window (6 hours on
# the Free plan, up to 7 days on Launch) - this keeps 30 days of dumps
# and survives losing the Neon account itself.
#
# Requires two repo secrets (Settings -> Secrets and variables -> Actions);
# the workflow fails until both exist:
#   BACKUP_DATABASE_URL  - the pathwaygh project's connection string from
#                          the Neon console (Connect -> turn OFF "Connection
#                          pooling" for the direct, non-pooled URL, which
#                          pg_dump needs).
#   BACKUP_ENCRYPTION_KEY - any long random passphrase (e.g. output of
#                          `openssl rand -base64 32`). The dump contains
#                          real student/guardian PII (emails, phone
#                          numbers, consent records), so it's encrypted
#                          before upload, never stored in the clear.
#
# To restore: download the artifact, then
#   gpg --decrypt --batch --passphrase-fd 0 backup.sql.gpg <<< "$BACKUP_ENCRYPTION_KEY" > backup.sql
#   psql "$DATABASE_URL" < backup.sql

on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC
  workflow_dispatch: {}

permissions:
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Dump database
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          if [ -z "$BACKUP_DATABASE_URL" ]; then
            echo "BACKUP_DATABASE_URL secret is not set - see this workflow's file header for setup." >&2
            exit 1
          fi
          # Ubuntu's own postgresql-client can be older than Neon's server,
          # and pg_dump refuses to dump a newer server major version. The
          # PostgreSQL project's apt repo (PGDG) provides the newest client,
          # which can dump every older server version too.
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y >/dev/null
          sudo apt-get install -y -qq postgresql-client
          pg_dump --version
          pg_dump "$BACKUP_DATABASE_URL" --no-owner --no-privileges -f backup.sql

      - name: Encrypt dump
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "BACKUP_ENCRYPTION_KEY secret is not set - see this workflow's file header for setup." >&2
            exit 1
          fi
          gpg --symmetric --batch --yes --passphrase-fd 0 --cipher-algo AES256 -o backup.sql.gpg backup.sql <<< "$BACKUP_ENCRYPTION_KEY"
          rm -f backup.sql

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v6
        with:
          name: db-backup-${{ github.run_id }}
          path: backup.sql.gpg
          retention-days: 30

      - name: Open an alert issue if the backup failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh issue create --title "🔴 Nightly database backup failed" \
            --body "The scheduled backup run failed on $(date -u '+%Y-%m-%d %H:%M UTC'). See: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
